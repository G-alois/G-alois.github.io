{% include base_path %}

<button id="theme-toggle" class="theme-toggle-floating" type="button" aria-label="Switch to light mode" aria-pressed="true" title="Toggle color theme">
  <i id="theme-icon" class="fa-solid fa-moon nav-icon" aria-hidden="true"></i>
  <span id="theme-label" class="visually-hidden">Dark</span>
</button>

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item">
              <a href="{{ domain }}{{ link.url }}">
                {% if link.icon %}
                  <i class="{{ link.icon }} nav-icon" aria-hidden="true"></i>
                {% endif %}
                <span>{{ link.title }}</span>
              </a>
            </li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
